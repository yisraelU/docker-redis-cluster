name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yisraelu/valkey-cluster:test
          build-args: VALKEY_VERSION=8

      - name: Test cluster starts
        run: |
          docker run -d --name valkey-test yisraelu/valkey-cluster:test
          sleep 10
          docker exec valkey-test valkey-cli -p 7000 cluster info | grep -q "cluster_state:ok"
          docker exec valkey-test valkey-cli -p 7000 cluster nodes | grep -c "master" | grep -q "3"
          echo "Cluster is healthy"
          docker stop valkey-test
