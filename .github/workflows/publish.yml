name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      valkey_version:
        description: "Valkey base image version (e.g. 8, 8.0.1, 7.2)"
        required: true
        default: "8"
      image_tag:
        description: "Docker Hub tag to publish (e.g. 8.0.1, latest)"
        required: true
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions from tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VALKEY_VERSION=${TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Resolve versions from manual input
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "VALKEY_VERSION=${{ github.event.inputs.valkey_version }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yisraelu/valkey-cluster:${{ env.IMAGE_TAG }}
            yisraelu/valkey-cluster:latest
          build-args: VALKEY_VERSION=${{ env.VALKEY_VERSION }}
